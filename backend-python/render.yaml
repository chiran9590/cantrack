services:
  - type: web
    name: cantrack-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: OPEN_REGISTRATION
        value: "true"
      - key: REGISTRATION_ROLE
        value: "member"
      - key: PHENOMEONE_BASE_URL
        value: ""
      - key: PHENOMEONE_USER
        value: ""
      - key: PHENOMEONE_PASSWORD
        value: ""
